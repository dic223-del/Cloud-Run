steps:
  # 1. 建置 Docker 映像檔
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/service1:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/service1:$SHORT_SHA'
      - '.'

  # 2. 推送至 Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/service1:latest'

  # 3. 部署到 Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=.'
      - '--image=gcr.io/$PROJECT_ID/service1:latest'
      - '--location=asia-east1'
      - '--namespace=default'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=asia-east1'
      - 'CLOUDSDK_RUN_PLATFORM=managed'

# 部署選項
options:
  machineType: 'N1_HIGHCPU_8'

# 預期映像檔
images:
  - 'gcr.io/$PROJECT_ID/service1:latest'
  - 'gcr.io/$PROJECT_ID/service1:$SHORT_SHA'
